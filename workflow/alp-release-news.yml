# Sender hver release, der er lagt ud, som et kort til linjen «Release News» på agentics.dk.
#
# Kopiér filen til .github/workflows/alp-release-news.yml i projektets repo og udfyld
# værdierne under `env:`. Der er INGEN secrets: jobbet beder GitHub om et OIDC-token for
# linjens URL, og linjen tager imod det, fordi repoet står på linjens liste «Trusted GitHub
# repositories» (linjens Settings på agentics.dk).
#
# Kortet sendes, når release-workflowet er FÆRDIGT og grønt — altså når versionen faktisk
# er ude hos brugerne, ikke når release-PR'et merges. `workflows:` herunder skal være
# release-workflowets `name:`. Kun kørsler, hvis commit er «chore(main): release x.y.z»,
# giver et kort; et almindeligt push til main kører også release-workflowet, men laver
# ingen release.
#
# Håndkørsel: Actions → ALP release news → Run workflow → version.

name: ALP release news

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version:
        description: "Versionen at skrive nyheden til (x.y.z)"
        required: true

permissions:
  contents: read
  id-token: write

env:
  ALP_SERVER: https://agentics.dk
  ALP_OWNER: <owner>          # handle på agentics.dk
  ALP_PROJECT: <project>      # projektets id i URL'en
  ALP_LINE_ID: <lineId>       # står i URL'en efter importen
  RELEASES_FILE: tickets/releases.json
  TICKETS_DIR: tickets
  CHECK: node tickets/tools/check-releases.mjs

concurrency:
  group: alp-release-news
  cancel-in-progress: false

jobs:
  send-card:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       startsWith(github.event.workflow_run.head_commit.message, 'chore(main): release '))
    runs-on: ubuntu-latest
    steps:
      - name: Find versionen
        id: v
        env:
          INPUT: ${{ inputs.version }}
          MESSAGE: ${{ github.event.workflow_run.head_commit.message }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          if [ -n "$INPUT" ]; then V="$INPUT"; else
            V=$(printf '%s' "$MESSAGE" | head -1 | sed -nE 's/^chore\(main\): release ([0-9]+\.[0-9]+\.[0-9]+).*/\1/p')
          fi
          case "$V" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Kunne ikke læse en version (fik «$V»)."; exit 1;;
          esac
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "run_url=${RUN_URL:-}" >> "$GITHUB_OUTPUT"

      - name: Send kortet til linjen
        env:
          VERSION: ${{ steps.v.outputs.version }}
          RUN_URL: ${{ steps.v.outputs.run_url }}
          EVENT: ${{ github.event_name }}
        run: |
          case "$ALP_OWNER$ALP_PROJECT$ALP_LINE_ID" in *'<'*)
            echo "::error::Udfyld ALP_OWNER, ALP_PROJECT og ALP_LINE_ID under env: i workflowet."; exit 1;;
          esac
          LINE_PAGE="$ALP_SERVER/p/$ALP_OWNER/$ALP_PROJECT/assembly-lines/$ALP_LINE_ID"
          LINE_URL="$ALP_SERVER/api/owners/$ALP_OWNER/projects/$ALP_PROJECT/assembly-lines/$ALP_LINE_ID/tasks"

          OIDC=$(curl -sS -G -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            --data-urlencode "audience=$LINE_PAGE" "$ACTIONS_ID_TOKEN_REQUEST_URL" | jq -r '.value // empty')
          if [ -z "$OIDC" ]; then
            echo "::error::Kunne ikke få et OIDC-token — har jobbet 'permissions: id-token: write'?"; exit 1
          fi

          jq -nc --arg repo "$GITHUB_REPOSITORY" --arg v "$VERSION" --arg run "$RUN_URL" --arg event "$EVENT" \
                 --arg rf "$RELEASES_FILE" --arg td "$TICKETS_DIR" --arg check "$CHECK" '{
            title: ("Release-nyhed: " + $v),
            description: ([
              "---",
              "source: \"release-news\"",
              "repo: \"" + $repo + "\"",
              "version: \"" + $v + "\"",
              "tag: \"v" + $v + "\"",
              "releases_file: \"" + $rf + "\"",
              "tickets_dir: \"" + $td + "\"",
              "check: \"" + $check + "\"",
              "run_url: \"" + $run + "\"",
              "event: \"" + $event + "\"",
              "---",
              "",
              "Version " + $v + " af " + $repo + " er lagt ud. Skriv nyheden til brugerne."
            ] | join("\n")),
            labels: ["runner", "release-news", ("version:" + $v)],
            priority: "medium"
          }' > card.json
          code=$(curl -sS -o resp.json -w '%{http_code}' -X POST "$LINE_URL" \
            -H "Authorization: Bearer $OIDC" -H "Content-Type: application/json" \
            --data @card.json)
          echo "HTTP $code"; cat resp.json; echo
          case "$code" in
            200|201) ;;
            403) echo "::error::Linjen afviste tokenet (403): står $GITHUB_REPOSITORY på linjens «Trusted GitHub repositories»? ($LINE_PAGE/settings)"; exit 1;;
            *) echo "::error::Linjen afviste kortet (HTTP $code)"; exit 1;;
          esac
